name: LeadRescue CI / Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://app.leadrescue.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://mock-project-ref.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-mock-service-role-key

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check (Prettier)
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: TypeScript Compilation Check
        run: npm run typecheck

      - name: Test Suite (Unit, Integration & E2E)
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
